# Publica o app do cliente (pasta consulta-cliente) no GitHub Pages:
# https://royalparafusos.github.io/royal/
name: Publicar app do cliente

on:
  push:
    branches: [main]
    paths: ['consulta-cliente/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./consulta-cliente
          publish_branch: gh-pages
